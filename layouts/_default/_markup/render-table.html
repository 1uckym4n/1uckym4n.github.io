{{- $headings := slice -}}
{{- range index .THead 0 -}}
  {{- $headings = $headings | append (.Text | plainify) -}}
{{- end -}}
<div class="article-table" role="region" tabindex="0"
  aria-label="{{ delimit $headings " / " }}" data-columns="{{ len $headings }}">
  <table
    {{- range $key, $value := .Attributes }}
      {{- if $value }}{{ printf " %s=%q" $key $value | safeHTMLAttr }}{{ end }}
    {{- end }}>
    <thead>
      {{- range .THead }}
      <tr>
        {{- range . }}
        <th scope="col"{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</th>
        {{- end }}
      </tr>
      {{- end }}
    </thead>
    <tbody>
      {{- range .TBody }}
      <tr>
        {{- range . }}
        <td{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</td>
        {{- end }}
      </tr>
      {{- end }}
    </tbody>
  </table>
</div>
