# Giao diện & tính năng — đầy đủ options: https://blowfish.page/docs/configuration/
colorScheme = "ocean"           # bộ màu xanh blue: ocean
defaultAppearance = "dark"      # site thiết kế dark theo video nền
autoSwitchAppearance = false    # không tự theo OS; nút chuyển sáng/tối vẫn hoạt động

enableSearch = true             # ô tìm kiếm trên header
smartTOC = true                 # theo dõi mục đang đọc
smartTOCHideUnfocusedChildren = false
enableCodeCopy = true           # nút copy ở code block
defaultSocialImage = "img/background.jpg"
defaultBackgroundImage = "img/background.jpg"  # hero dự phòng cho bài chưa có featured
                                              # (frame trích từ chính video tuyết)

# Trang chủ: avatar tác giả (layout profile) + danh sách bài mới dạng card
[homepage]
  layout = "profile"
  showRecent = true
  showRecentItems = 9
  cardView = true             # Recent dạng lưới card (template có sẵn của theme)
  cardViewScreenWidth = true  # card chiếm toàn bộ chiều ngang, lưới 3 cột
  showMoreLink = true         # nút Show More
  showMoreLinkDest = "/blogs/"
[header]
  layout = "floating"
# Trang danh sách của từng section
[list]
  showHero = false
  showSummary = false   # card gọn: không hiện đoạn tóm tắt
  showTableOfContents = false
  showCards = true      # bài hiển thị dạng card viền bo
  groupByYear = false   # không nhóm theo năm (tab lọc sẽ gọn hơn)

# Trang bài viết
[article]
  showDate = true
  showViews = true             # số lượt xem trên bài và card, lưu bằng Firebase
  showLikes = false
  showDateOnlyInArticle = false
  showDateUpdated = false
  showAuthor = false           # blog cá nhân — không cần box tác giả trong bài
  showReadingTime = false      # bỏ "x min"
  showWordCount = false        # bỏ "x words"
  showTaxonomies = true       # điều kiện để tag/category hiện ra
  showTags = true
  showTableOfContents = true
  showPagination = true
  showHero = true              # ảnh featured phủ lên đầu trang, chữ đè lên
  heroStyle = "background"     # thumbnail làm nền full-width (basic = ảnh nằm trong cột)
                               # chuyển cảnh nằm trong assets/js/blog-transition.js
  showRelatedContent = true    # mục "Bài liên quan" cuối trang (tính theo tags/categories)
  relatedContentLimit = 3      # tối đa 3 bài liên quan

