# Giao diện & tính năng — đầy đủ options: https://blowfish.page/docs/configuration/
colorScheme = "blowfish"        # bộ màu: blowfish, avocado, fire, ocean, slate, nocean
defaultAppearance = "dark"      # mặc định mở dark mode
autoSwitchAppearance = true     # theo theo hệ điều hành của người đọc

enableSearch = true             # ô tìm kiếm trên header
enableCodeCopy = true           # nút copy ở code block

# Trang chủ: avatar tác giả (layout profile) + danh sách bài mới dạng card
[homepage]
  layout = "profile"
  showRecent = true
  recentLimit = 6
  cardView = true
[header]
  layout = "floating"
# Trang danh sách của từng section
[list]
  showHero = false
  showSummary = true
  showTableOfContents = false
  showCards = true      # bài hiển thị dạng card viền bo
  groupByYear = false   # không nhóm theo năm (tab lọc sẽ gọn hơn)

# Trang bài viết
[article]
  showDate = true
  showDateOnlyInArticle = false
  showDateUpdated = false
  showAuthor = true
  showReadingTime = true
  showWordCount = false
  showTableOfContents = true
  showPagination = true
  showTags = true

# Mục footer
[footer]
  showCopyright = true
  showThemeAttribution = true
