# Cấu hình chính của site — tham khảo: https://blowfish.page/docs/getting-started/
theme = "blowfish"
baseURL = "https://1uckym4n.github.io/"
defaultContentLanguage = "en"
title = "dn4m"

enableRobotsTXT = true
paginate = 20
summaryLength = 30

buildDrafts = false
buildFuture = false

# Section chứa bài viết — trang chủ lấy bài mới từ đây
# ("Categories" là taxonomy và "About me" là trang đơn, không nằm trong mainSections)
[params]
  mainSections = ["blogs"]

[imaging]
  anchor = "Center"

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

# Bài viết liên quan (showRelatedContent) — Hugo mặc định chỉ tính "keywords",
# phải khai báo tags/categories vào đây thì nó mới so khớp được
[related]
  threshold = 0          # 0 = hiện mọi bài có chung tag/category, sắp theo độ khớp
  includeNewer = true    # tính cả bài cũ hơn
  toLower = true         # không phân biệt hoa/thường

[[related.indices]]
  name = "tags"
  weight = 100

[[related.indices]]
  name = "categories"
  weight = 100

[sitemap]
  changefreq = "daily"
  filename = "sitemap.xml"
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]
