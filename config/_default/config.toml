# Cấu hình chính của site — tham khảo: https://blowfish.page/docs/getting-started/
theme = "blowfish"
baseURL = "https://1uckym4n.github.io/"
defaultContentLanguage = "vi"
title = "Blog của tôi"

enableRobotsTXT = true
paginate = 20
summaryLength = 30

buildDrafts = false
buildFuture = false

# Các "loại blog" (section) hiển thị ở trang chủ
[params]
  mainSections = ["ky-thuat", "cti", "ctf"]

[imaging]
  anchor = "Center"

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = "daily"
  filename = "sitemap.xml"
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]
